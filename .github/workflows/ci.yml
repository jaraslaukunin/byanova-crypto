name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ($\{{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: $\{{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -o dist/bycr.exe .
          else
            go build -trimpath -o dist/bycr .
          fi
